name: Deploy site

# Runs on every push to main (keeps CSS/JS/HTML changes live)
# and can be triggered manually to rebuild claim pages from Supabase.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages:    write
  id-token: write   # required by actions/deploy-pages
  contents: read
  actions:  read    # to see when the site artifact is listed (wait step)

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The backend sync stores a hash of the published data in sync_state. While it
      # is unchanged, a code-only push reuses the last download (.data-cache)
      # instead of paging through every Supabase table again. Empty when the
      # table is missing → no cache, full download.
      - name: Read the data version
        id: data
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          v=$(curl -sf "$SUPABASE_URL/rest/v1/sync_state?id=eq.1&select=data_hash" \
                -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" \
              | python3 -c "import json,sys; r=json.load(sys.stdin); print(r[0]['data_hash'] if r else '')" 2>/dev/null || true)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "data version: ${v:-none}"

      - name: Restore the last download
        id: cache
        if: steps.data.outputs.version != ''
        uses: actions/cache/restore@v4
        with:
          path: .data-cache
          key: supabase-data-${{ steps.data.outputs.version }}

      - name: Generate claim pages + sitemap
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          DATA_VERSION:  ${{ steps.data.outputs.version }}
          # Manual and sync-triggered runs always download fresh data.
          FORCE_FETCH:   ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python build_claims.py

      - name: Save the download
        if: steps.data.outputs.version != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .data-cache
          key: supabase-data-${{ steps.data.outputs.version }}

      - name: Keep only the site (sources and tooling are not published)
        run: rm -rf build_claims.py site_chrome.py requirements.txt REDESIGN_PLAN.md templates tools __pycache__ .data-cache

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # the generated site (sources removed in the step above)

      # The site artifact is ~260 MB: GitHub can take a while to list it after the
      # upload, and deploy-pages fails ("No artifacts named github-pages") if it
      # looks too early. Wait until the artifact is listed (up to 3 minutes).
      - name: Wait for the artifact to be registered
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              | python3 -c "import json,sys; print(sum(a['name'] == 'github-pages' for a in json.load(sys.stdin).get('artifacts', [])))")
            if [ "$n" -ge 1 ]; then echo "artifact listed after $((i * 5))s"; sleep 10; exit 0; fi
            sleep 5
          done
          echo "artifact still not listed; deploying anyway"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
